name = "sub-store-workers"
main = "dist/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# KV Namespace bindings
# For production: run `wrangler kv namespace create SUB_STORE_DATA` and fill in the id
[[kv_namespaces]]
binding = "SUB_STORE_DATA"
id = "f9bef7215c5d4afe9188f990e528c02c"

# 定时同步（每天 23:55 执行）
[triggers]
crons = ["55 15 * * *"]

[vars]
# SUB_STORE_FRONTEND_BACKEND_PATH = "/你的密码"
# SUB_STORE_PUSH_SERVICE = "https://api.day.app/你的BarkKey/[推送标题]/[推送内容]"
SUB_STORE_BACKEND_SYNC_CRON = "30 */4 * * *"
SCRIPT_ENGINE = "quickjs"
SUB_STORE_BACKEND_CUSTOM_NAME = "Workers"
SUB_STORE_BACKEND_CUSTOM_ICON = "https://cdn.jsdelivr.net/gh/ios151/sub-store-workers@main/png/cloudflare.png"
